name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 07:00 UTC nightly (~midnight PT / 09:00 CET)
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # The suite runs against the static web export served by
      # scripts/serve-web.mjs, not against the Metro dev server. Booting
      # `expo start --web` needs a cold bundle before the first test can run
      # and is far too slow to be reliable here.
      - name: Build web bundle
        run: npx expo export --platform web

      # Playwright downloads a separate browser build for each OS release and
      # Playwright version: WebKit for Ubuntu 24.04 links against libicu74,
      # the 26.04 build against libicu78. runner.os is "Linux" on every
      # image, so the key needs the release, or a build cached on one image
      # is restored on another and fails to start.
      - name: Get Playwright cache key
        id: playwright-key
        run: |
          . /etc/os-release
          test -n "$ID" && test -n "$VERSION_ID"
          version=$(node -p "require('@playwright/test/package.json').version")
          test -n "$version"
          echo "os=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.playwright-key.outputs.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-key.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser (${{ matrix.browser }})
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run Playwright tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
